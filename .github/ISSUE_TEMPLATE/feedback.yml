name: Feedback from trying Avalok
description: What you tried, what you expected, and what happened (good or bad)
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Avalok. Short and honest is perfect.
        Please do **not** paste private source code, prompts, session transcripts or credentials. Security issues go through SECURITY.md, not here.
  - type: textarea
    id: goal
    attributes:
      label: What were you trying to do?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to see?
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what surprised you?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Avalok version
      description: Prefilled by `avalok feedback`
  - type: input
    id: node
    attributes:
      label: Node.js version
  - type: input
    id: platform
    attributes:
      label: Operating system
