name: Distribution

# Per OS: unit tests, then a neutral-path release build (source copied to a temporary path with
# spaces, frozen install, dist:build, dist:pack, build-machine path-leak scan) and the
# installed-product smoke test against that tarball: --version, --help, doctor, startup,
# dashboard/OTLP health, local HTTP security checks, OTLP JSON + protobuf, the standard Python
# exporter, restart persistence, shutdown/port release, orphan cleanup, and safe data clearing.
# Nothing is published.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  packed-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the standard OpenTelemetry Python exporter
        run: python -m pip install -r examples/python-otel-direct/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # The release script hides its neutral checkout during the smoke on POSIX. Windows keeps
      # files open, so it skips hiding; RUNNER_TEMP there is on D:, a different drive from the
      # user profile, which also exercises the cross-drive build-tracing case.
      - if: runner.os != 'Windows'
        run: pnpm release:build --python python
      - if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm release:build --python python --root "$env:RUNNER_TEMP"
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: agentmap-packed-tarball
          path: artifacts/release/*.tgz
          retention-days: 7
