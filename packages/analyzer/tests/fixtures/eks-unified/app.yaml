apiVersion: v1
kind: Namespace
metadata:
  name: research
  labels: { agentmap.dev/cluster: unified-platform }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: research }
spec:
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers: [{ name: backend, image: agentmap/backend:latest }]
