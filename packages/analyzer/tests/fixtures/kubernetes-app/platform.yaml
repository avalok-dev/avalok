apiVersion: v1
kind: Namespace
metadata:
  name: research
  labels:
    agentmap.dev/cluster: agentmap-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: research
data:
  LOG_LEVEL: info
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: research
type: Opaque
stringData:
  API_TOKEN: fixture-secret-must-not-leak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: research
spec:
  replicas: 3
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
    spec:
      serviceAccountName: backend
      containers:
        - name: api
          image: ghcr.io/agentmap/backend:1.2.3
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: research
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research
  namespace: research
spec:
  rules:
    - host: research.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 80 } }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: research
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: research
spec:
  minReplicas: 2
  maxReplicas: 8
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
