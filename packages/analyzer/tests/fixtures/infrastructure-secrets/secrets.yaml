apiVersion: v1
kind: Secret
metadata: { name: database, namespace: secure }
data:
  password: c3VwZXItc2VjcmV0
stringData:
  token: never-show-this-token
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: secure-api, namespace: secure }
spec:
  selector: { matchLabels: { app: secure-api } }
  template:
    metadata: { labels: { app: secure-api } }
    spec:
      containers:
        - name: api
          image: secure-api:latest
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: database, key: password } }
