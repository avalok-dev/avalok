apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: default }
spec:
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        [{ name: backend, image: example/backend:latest, ports: [{ containerPort: 3000 }] }]
