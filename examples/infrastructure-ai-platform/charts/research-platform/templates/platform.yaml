apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels: { agentmap.dev/cluster: research-platform }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: {{ .Values.namespace }} }
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: {{ .Values.backend.image }}
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: {{ .Values.namespace }} }
spec:
  replicas: {{ .Values.worker.replicas }}
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers: [{ name: worker, image: {{ .Values.worker.image }} }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: {{ .Values.namespace }} }
spec:
  replicas: 2
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        [
          {
            name: frontend,
            image: {{ .Values.frontend.image }},
            ports: [{ containerPort: 3000 }],
          },
        ]
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: {{ .Values.namespace }} }
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research
  namespace: {{ .Values.namespace }}
  labels: { agentmap.dev/load-balancer: research-alb }
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 80 } } }
